<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Perfil de Usuario Refinado</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <main class="card-container">
        <header class="form-header">
            <h2>Perfil de Usuario</h2>
            <p class="subtitle">Gestiona la información del efectivo en el sistema</p>
        </header>
        <form class="custom-form">
            <div class="input-group">
                <label for="txt-nombre">Nombre Completo</label>
                <input type="text" id="txt-nombre" value="Eduardo Angeles" placeholder="Ej. Fernando Zegarra">
            </div>
            <div class="input-group">
                <label for="txt-codigo">Código CIP</label>
                <input type="text" id="txt-codigo" value="770697D" placeholder="Ej. 123456">
            </div>

            <div class="form-actions">
                <button type="button" class="btn btn-secondary">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar Cambios</button>
            </div>
        </form>
    </main>
</body>
</html>>
